<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS OS</title>
<style>
:root{--bg:#06090d;--fg:#e6f6fa;--ac:#3cc3d8;--card:#0f161d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,Segoe UI,sans-serif;max-width:640px;margin:auto;padding:16px}
h1{font-size:15px;letter-spacing:.3em;color:var(--ac);text-align:center;margin:8px 0}
#orb{width:130px;height:130px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#9ff1ff,var(--ac) 40%,#0b3a45 75%);box-shadow:0 0 40px var(--ac);animation:p 3s ease-in-out infinite}
#orb.on{animation-duration:.8s}
@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 70px var(--ac)}}
#status{text-align:center;min-height:44px;font-size:15px}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;background:var(--card);border:1px solid #234;color:var(--fg);padding:12px;border-radius:10px;font-size:16px}
button{background:var(--ac);color:#001;border:0;padding:12px 16px;border-radius:10px;font-weight:700;font-size:16px}
#mic{width:100%;padding:16px;font-size:18px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:12px;letter-spacing:.2em;color:var(--ac);margin:0 0 8px}
.card div{padding:6px 0;border-bottom:1px solid #1b2630;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.card div:last-child{border:0}
.x{background:none;color:#789;padding:0 6px}
small{color:#789}
</style></head><body>
<h1>JARVIS OS</h1>
<div id="orb"></div>
<div id="status">Sag: „Merk dir …“, „Aufgabe …“, „Suche …“, „Uhrzeit“</div>
<button id="mic">🎤 Sprechen</button>
<div class="row"><input id="t" placeholder="Oder tippen…"><button id="go">OK</button></div>
<div class="card"><h2>GEDÄCHTNIS</h2><span id="mem"></span></div>
<div class="card"><h2>AUFGABEN</h2><span id="todo"></span></div>
<small>Daten bleiben nur auf diesem Gerät. Befehle: merk dir · aufgabe · suche · uhrzeit · datum · timer X minuten · was weißt du</small>
<script>
const $=id=>document.getElementById(id);
let S={mem:[],todo:[]};
try{S=JSON.parse(localStorage.getItem('jarvis'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('jarvis',JSON.stringify(S))}catch(e){}};
function render(){
 for(const k of['mem','todo']){
  $(k).innerHTML=S[k].length?S[k].map((x,i)=>`<div><span>${x.replace(/</g,'&lt;')}</span><button class="x" onclick="del('${k}',${i})">✕</button></div>`).join(''):'<small>leer</small>';
 }
}
window.del=(k,i)=>{S[k].splice(i,1);save();render()};
function say(m){
 $('status').textContent=m;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.lang='de-DE';speechSynthesis.speak(u)}catch(e){}
}
function route(q){
 const s=q.trim(),l=s.toLowerCase();
 let m;
 if(m=l.match(/^(merk dir|merke dir|speichere|remember)\s+(.+)/)){S.mem.push(s.slice(m[1].length).trim());save();render();return say('Gemerkt.')}
 if(m=l.match(/^(aufgabe|todo|erinnere mich an)\s+(.+)/)){S.todo.push(s.slice(m[1].length).trim());save();render();return say('Aufgabe hinzugefügt.')}
 if(/was weißt du|gedächtnis/.test(l))return say(S.mem.length?'Ich weiß: '+S.mem.join('. '):'Noch nichts gespeichert.');
 if(/uhrzeit|wie spät/.test(l))return say('Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.');
 if(/datum|welcher tag/.test(l))return say('Heute ist '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+'.');
 if(m=l.match(/timer.*?(\d+)\s*min/)){const n=+m[1];setTimeout(()=>say('Timer abgelaufen: '+n+' Minuten.'),n*6e4);return say('Timer läuft: '+n+' Minuten.')}
 if(m=l.match(/^(suche|google|such)\s+(.+)/)){const q2=s.slice(m[1].length).trim();say('Suche nach '+q2);window.open('https://duckduckgo.com/?q='+encodeURIComponent(q2),'_blank');return}
 say('Nicht verstanden. Probier „Merk dir …“ oder „Suche …“.');
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
 if(!SR)return say('Spracheingabe nicht unterstützt – bitte tippen.');
 const r=new SR();r.lang='de-DE';r.onstart=()=>{$('orb').classList.add('on');$('status').textContent='Ich höre…'};
 r.onend=()=>$('orb').classList.remove('on');
 r.onerror=()=>say('Mikrofon nicht erlaubt oder Fehler.');
 r.onresult=e=>{const x=e.results[0][0].transcript;$('t').value=x;route(x)};
 r.start();
};
$('go').onclick=()=>{if($('t').value){route($('t').value);$('t').value=''}};
$('t').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
render();
</script></body></html>
