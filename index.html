<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02070f">
<title>JARVIS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02070f;--c:#00e5ff;--b:#1e7bff;--t:#d9f8ff;--f:"Orbitron",ui-monospace,Menlo,monospace;--k:1}
body[data-s="thinking"]{--k:.22}
body[data-s="speaking"]{--k:.5}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(80% 55% at 50% 30%,#06284a 0%,var(--bg) 75%) fixed;color:var(--t);font-family:var(--f);
  display:flex;flex-direction:column;align-items:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px) 0 0/100% 4px}
h1{font-size:clamp(22px,6vw,34px);font-weight:700;letter-spacing:.35em;text-indent:.35em;text-shadow:0 0 16px var(--c)}
.reactor{position:relative;width:min(64vw,270px);aspect-ratio:1;flex:none}
.reactor>*{position:absolute;border-radius:50%}
.r1{inset:0;background:repeating-conic-gradient(var(--c) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 66%,#000 67%,#000 72%,transparent 73%);mask:radial-gradient(circle,transparent 66%,#000 67%,#000 72%,transparent 73%);
  animation:spin calc(var(--k)*16s) linear infinite;filter:drop-shadow(0 0 6px var(--c))}
.r2{inset:12%;border:2px dashed var(--b);animation:spin calc(var(--k)*10s) linear infinite reverse;box-shadow:0 0 18px rgba(30,123,255,.5)}
.r3{inset:24%;background:conic-gradient(var(--c) 0 25%,transparent 25% 33%,var(--c) 33% 58%,transparent 58% 66%,var(--c) 66% 91%,transparent 91% 100%);
  -webkit-mask:radial-gradient(circle,transparent 70%,#000 71%,#000 80%,transparent 81%);mask:radial-gradient(circle,transparent 70%,#000 71%,#000 80%,transparent 81%);
  animation:spin calc(var(--k)*7s) linear infinite;filter:drop-shadow(0 0 8px var(--c))}
.core{inset:38%;background:radial-gradient(circle,#fff 0%,#a8f6ff 30%,var(--c) 60%,rgba(0,229,255,0) 100%);
  box-shadow:0 0 40px 10px rgba(0,229,255,.55);animation:beat calc(var(--k)*3s) ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}
#state{font-size:13px;letter-spacing:.3em;color:var(--c);text-indent:.3em;margin-top:-8px}
#out{width:100%;max-width:560px;min-height:110px;padding:16px 18px;border:1px solid rgba(0,229,255,.45);border-radius:14px;background:rgba(4,28,52,.6);
  box-shadow:0 0 24px rgba(0,229,255,.12) inset;font:500 17px/1.5 system-ui,-apple-system,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
#lnk{display:block;width:100%;max-width:560px;text-align:center;text-decoration:none;color:#02121f;background:linear-gradient(135deg,var(--c),var(--b));
  padding:14px;border-radius:12px;font-weight:700;letter-spacing:.08em;font-size:15px}
.row{display:flex;gap:10px;width:100%;max-width:560px}
input{flex:1;min-width:0;font:500 16px system-ui,sans-serif;color:var(--t);background:rgba(4,28,52,.7);border:1px solid rgba(0,229,255,.5);border-radius:12px;padding:14px;outline:none}
input:focus{box-shadow:0 0 16px rgba(0,229,255,.5)}
input::placeholder{color:#6aa5bd}
button{font:700 14px var(--f);letter-spacing:.1em;color:#02121f;background:linear-gradient(135deg,var(--c),var(--b));border:0;border-radius:12px;padding:0 20px;cursor:pointer;box-shadow:0 0 18px rgba(0,229,255,.45)}
button:disabled{opacity:.5}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.reactor>*{animation:none}}
</style>
</head>
<body data-s="idle">
<h1>J.A.R.V.I.S</h1>
<div class="reactor" aria-hidden="true"><div class="r1"></div><div class="r2"></div><div class="r3"></div><div class="core"></div></div>
<div id="state">BEREIT</div>
<div id="out" role="status" aria-live="polite">Zu Diensten, Sir.</div>
<a id="lnk" target="_blank" rel="noopener" hidden></a>
<div class="row">
  <input id="in" type="text" placeholder="Befehl eingeben …" autocomplete="off" enterkeyhint="send">
  <button id="go" type="button">SENDEN</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const MODEL = "openai"; // alternativ z. B. "qwen-coder" oder "llama", falls vom Dienst angeboten
const SYSTEM = "Du bist JARVIS. Du antwortest kurz, präzise, leicht sarkastisch und sprichst mich mit 'Sir' an.";
const LABEL = { idle: "BEREIT", thinking: "DENKT NACH", speaking: "SPRICHT" };
let hist = [], busy = false, voice = null;

function setS(s) { document.body.dataset.s = s; $("state").textContent = LABEL[s]; }

/* ---- Sprachausgabe (Browser, kostenlos) ---- */
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices().filter((x) => (x.lang || "").toLowerCase().startsWith("de"));
  voice = v.find((x) => /markus|yannick|reed|stefan|jonas|martin|hans|viktor|male/i.test(x.name)) || v.find((x) => x.localService) || v[0] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }
function unlock() { try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {} }
function speak(text) {
  return new Promise((res) => {
    if (!("speechSynthesis" in window)) { res(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 1; u.pitch = 0.95;
    let done = false; const fin = () => { if (!done) { done = true; setS("idle"); res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, text.length * 100 + 5000);
    setS("speaking"); speechSynthesis.speak(u);
  });
}

/* ---- KI: Pollinations.ai (ohne Key) ---- */
async function ask(text) {
  const messages = [{ role: "system", content: SYSTEM }, ...hist, { role: "user", content: text }];
  let out = "";
  try {
    const r = await fetch("https://text.pollinations.ai/openai", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages, max_tokens: 400, temperature: 0.8 })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    out = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "";
  } catch (e) {
    const r = await fetch("https://text.pollinations.ai/" + encodeURIComponent(text) + "?model=" + MODEL + "&system=" + encodeURIComponent(SYSTEM));
    if (!r.ok) throw new Error("HTTP " + r.status);
    out = await r.text();
  }
  out = String(out).replace(/\n+(?:---\n+)?\**\s*(?:Powered by|Support)\s+Pollinations[\s\S]*$/i, "").trim() || "Dazu fällt mir nichts ein, Sir.";
  hist.push({ role: "user", content: text }, { role: "assistant", content: out });
  if (hist.length > 12) hist = hist.slice(-12);
  return out;
}

/* ---- eBay-Suche ---- */
const TRIGGER = /\b(e-?bay|suche|suchen|finde|finden|kaufen|kaufe|kauf)\b/i;
const FILLER = /\b(jarvis|bitte|sir|mir|mich|auf|bei|nach|ein|eine|einen|einem|ich|will|möchte|moechte|kannst|du|kann|mal|schnell|gerne|e-?bay(?:\.de)?|suche|suchen|finde|finden|kaufen|kaufe|kauf)\b/gi;
function extract(t) { return t.replace(FILLER, " ").replace(/[.,!?;:]+/g, " ").replace(/\s+/g, " ").trim(); }

/* ---- Ablauf ---- */
async function send() {
  const text = $("in").value.trim();
  if (!text || busy) return;
  $("in").value = ""; busy = true; $("go").disabled = true; $("lnk").hidden = true; unlock();

  if (TRIGGER.test(text)) {
    const q = extract(text);
    if (!q) {
      const m = "Was soll ich suchen, Sir?";
      $("out").textContent = m; await speak(m);
    } else {
      const url = "https://www.ebay.de/sch/i.html?_nkw=" + encodeURIComponent(q);
      const w = window.open("", "_blank"); // sofort öffnen, damit iOS den Tab nicht blockiert
      if (w) { try { w.document.title = "JARVIS"; w.document.body.style.cssText = "background:#02070f;color:#00e5ff;font:22px system-ui;display:grid;place-items:center;height:100vh;margin:0"; w.document.body.textContent = "JARVIS sucht …"; } catch (e) {} }
      const line = "Sehr wohl, Sir. Ich öffne die eBay-Suche für " + q + ".";
      $("out").textContent = line;
      $("lnk").href = url; $("lnk").textContent = "EBAY ÖFFNEN: " + q.toUpperCase(); $("lnk").hidden = false;
      await speak(line);
      if (w) w.location.href = url;
    }
  } else {
    setS("thinking"); $("out").textContent = "…";
    try { const a = await ask(text); $("out").textContent = a; await speak(a); }
    catch (e) { setS("idle"); $("out").textContent = "Die Verbindung ist gestört, Sir. (" + e.message + ") Bitte erneut versuchen."; }
  }
  busy = false; $("go").disabled = false;
}
$("go").addEventListener("click", send);
$("in").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } });
</script>
</body>
</html>
